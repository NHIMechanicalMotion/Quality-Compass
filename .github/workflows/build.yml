name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Confirm SPA output
        run: |
          test -f dist/index.html
          test -f dist/_redirects
      - name: Validate wrangler deploy
        run: npx wrangler deploy --dry-run
      - name: Validate wrangler versions upload
        run: npx wrangler versions upload --dry-run
