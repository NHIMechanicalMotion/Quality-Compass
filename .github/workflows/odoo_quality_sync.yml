name: Odoo Quality Telemetry Sync

on:
  schedule:
    # Runs hourly at minute 0 (once per hour)
    - cron: '0 * * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/odoo_quality_sync.yml'
  workflow_dispatch:
    inputs:
      force_full_resync:
        description: "Force full historical resynchronization from Odoo"
        type: boolean
        default: false

jobs:
  sync-odoo-quality:
    name: Sync Odoo Quality Telemetry to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase

      - name: Run Quality Sync Pipeline
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/sync_odoo_quality.py
