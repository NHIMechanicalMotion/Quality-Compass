name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Confirm Pages output
        run: |
          test -f dist/index.html
          test -f dist/_redirects
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('wrangler.json','utf8')); if (c.pages_build_output_dir !== 'dist') { console.error('expected pages_build_output_dir dist'); process.exit(1) }"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Set repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID on the Pages account that owns quality-compass (account 91b0009136c2aea55f4a0b8445cb0fc5). Workers Builds on the other account cannot update that Pages project."
            exit 1
          fi
          npx wrangler pages deploy dist --project-name=quality-compass
