name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate Workers assets config
        run: npx wrangler deploy --dry-run
      - name: Validate preview upload config
        run: npx wrangler versions upload --dry-run
